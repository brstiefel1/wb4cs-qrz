lane" fill="#5fb3a3">VHF/UHF · FM</text><path d="M60,244 H30 V775 H58" class="vu" marker-end="url(#arrT)"/><rect x="60" y="742" width="340" height="66" rx="10" fill="#122438" stroke="#24405a" stroke-width="1.5"/><text x="230" y="770" class="t" text-anchor="middle">MR18 Aux Bus (pre-EQ)</text><text x="230" y="792" class="s" text-anchor="middle">6-band parametric EQ · Gentle compressor</text><path d="M230,808 V836" class="vu" marker-end="url(#arrT)"/><rect x="60" y="838" width="340" height="66" rx="10" fill="#122438" stroke="#24405a" stroke-width="1.5"/><text x="230" y="866" class="t" text-anchor="middle">MR18 Bus Insert</text><text x="230" y="888" class="s" text-anchor="middle">Aural exciter for FM clarity</text><path d="M230,904 V932" class="vu" marker-end="url(#arrT)"/><rect x="60" y="934" width="340" height="66" rx="10" fill="#122438" stroke="#24405a" stroke-width="1.5"/><text x="230" y="962" class="t" text-anchor="middle">30 dB Pad</text><text x="230" y="984" class="s" text-anchor="middle">XLR → Kenwood 8-pin modular</text><path d="M230,1000 V1028" class="vu" marker-end="url(#arrT)"/><rect x="60" y="1030" width="340" height="66" rx="10" fill="#122438" stroke="#5fb3a3" stroke-width="2"/><text x="230" y="1058" class="t" text-anchor="middle">Kenwood TM-V71A</text><text x="230" y="1080" class="s" text-anchor="middle">Dual-band mobile · 2 m · 70 cm FM</text><rect x="60" y="1140" width="340" height="66" rx="10" fill="#122438" stroke="#24405a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="230" y="1168" class="t" text-anchor="middle">PC (USB audio)</text><text x="230" y="1190" class="s" text-anchor="middle">↔ MR18 · Playback to radios · Recording</text>
<text x="30" y="1244" class="s" font-size="12">Mixer: Midas MR18 · Profiles: Ragchew · DX · Recording</text>
