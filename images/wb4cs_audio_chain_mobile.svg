<text x="30" y="68" font-family="'IBM Plex Mono','Liberation Mono','DejaVu Sans Mono',monospace" font-size="15" font-weight="500" fill="#93a7ba">STATION AUDIO CHAIN</text>
<text x="30" y="92" class="s">One microphone, two radios, each path tuned for its mode.</text>
